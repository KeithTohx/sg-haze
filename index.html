<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haze in Singapore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cabin&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main" class="container">
        <h2>Haze in Singapore</h2>
        <p id="title_time"></p>
        <div class="info-box">
            <p id="overview_title" style="margin-bottom: 10px;"></p>
            <div id="overview"></div>
        </div>
        <div class="info-box">
            <div style="margin-bottom: 10px;">
                <a id="pm25_1hr" class="btn">1-hr PM2.5</a>
                <a id="psi_24hr" class="btn">24-hr PSI</a>
            </div>
            <p id="subtitle"></p>
            <div>
                <div class="map-wrapper" id="map">
                    <svg id="svg" viewBox="0 0 1000 750" preserveAspectRatio="xMidYMid meet"></svg>
                </div>
            </div>
            <div id="descriptor"></div>
        </div>
        <p id="remarks" style="color: gray;"></p>
    </div>
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
